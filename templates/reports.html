{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block heading %}Daily report{% endblock %}
{% block crumb %}Today?s activity, grouped by zone{% endblock %}
{% block content %}
<section class="panel" aria-label="Daily report">
  <div id="r-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px"></div>

  <h2 style="margin:18px 0 8px">Throughput by zone</h2>
  <div class="table-wrap">
    <table class="table">
      <thead><tr><th>Zone</th><th class="num">Sessions</th></tr></thead>
      <tbody id="r-throughput"></tbody>
    </table>
  </div>

  <div id="r-revenue-wrap" hidden>
    <h2 style="margin:18px 0 8px">Revenue</h2>
    <div id="r-revenue-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px"></div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script type="module" src="/static/js/pages/reports.js?v={{ asset_version }}"></script>
{% endblock %}
