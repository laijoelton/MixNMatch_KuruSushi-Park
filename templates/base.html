<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Live{% endblock %} · ParkGuardian</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}" />
</head>
{% set active = active | default('live') %}
<body data-page="{{ active }}">
  <div class="app">
    <nav class="rail" aria-label="Primary">
      <a class="brand" href="/" title="ParkGuardian">PG</a>
      <a href="/" class="rail-link {% if active == 'live' %}is-active{% endif %}" {% if active == 'live' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 12h5M16 12h5"/></svg>
        Live
      </a>
      <a href="/history" class="rail-link {% if active == 'history' %}is-active{% endif %}" {% if active == 'history' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        History
      </a>
      <a href="/payments" data-cap="fin:view" hidden class="rail-link {% if active == 'payments' %}is-active{% endif %}" {% if active == 'payments' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
        Payments
      </a>
      <a href="/admin" data-cap="admin:users" hidden class="rail-link {% if active == 'admin' %}is-active{% endif %}" {% if active == 'admin' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
        Admin
      </a>
      <a href="/penalties" data-cap="fin:view" hidden class="rail-link {% if active == 'penalties' %}is-active{% endif %}" {% if active == 'penalties' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        Penalties
      </a>
      <a href="/reports" class="rail-link {% if active == 'reports' %}is-active{% endif %}" {% if active == 'reports' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
        Reports
      </a>
      <a href="/ml-insights" class="rail-link {% if active == 'ml-insights' %}is-active{% endif %}" {% if active == 'ml-insights' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 2.5 1.2 4 2.2 5.2.6.7 1 1.3 1 2.3v1.5h7.6v-1.5c0-1 .4-1.6 1-2.3C17.8 13 19 11.5 19 9a7 7 0 0 0-7-7z"/><path d="M9.5 21h5"/></svg>
        Insights
      </a>
      <a href="/tariffs" data-cap="fin:view" hidden class="rail-link {% if active == 'tariffs' %}is-active{% endif %}" {% if active == 'tariffs' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z"/><circle cx="8" cy="8" r="1.4"/></svg>
        Tariffs
      </a>
      <a href="/logs" class="rail-link {% if active == 'logs' %}is-active{% endif %}" {% if active == 'logs' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        Logs
      </a>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1>{% block heading %}Live operations{% endblock %}</h1>
          <span class="crumb">{% block crumb %}{% endblock %}</span>
        </div>
        <div class="topbar-status">
          <span id="conn-pill" class="pill">Connecting…</span>
          <span id="autopilot-pill" class="pill" hidden></span>
          <span id="level-pill" class="pill plain" hidden></span>
        </div>
        <div class="topbar-spacer"></div>
        <div class="bell-wrap">
          <button id="ml-bell-btn" class="btn ghost icon bell-btn" type="button" aria-label="Notifications" title="Notifications">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="ml-bell-badge" class="bell-badge" hidden>0</span>
          </button>
          <div id="ml-bell-popover" class="bell-popover" hidden>
            <div class="bell-popover-head">Notifications</div>
            <div id="ml-bell-list" class="bell-list"></div>
          </div>
        </div>
        <button id="palette-btn" class="search-btn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>Plate, bay, gate…</span><kbd>Ctrl K</kbd>
        </button>
        <div class="user-menu">
          <span class="avatar" id="user-avatar" aria-hidden="true"></span>
          <span class="user-meta"><b id="user-name">…</b><span id="user-role"></span></span>
          <button id="logout-btn" class="btn ghost small" type="button">Sign out</button>
        </div>
      </header>
      <div id="banners" role="region" aria-label="System notices"></div>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <aside id="drawer" class="drawer" aria-hidden="true" tabindex="-1" aria-labelledby="drawer-title"></aside>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="palette" class="palette" hidden></div>

  {% block scripts %}{% endblock %}
</body>
</html>
