<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Check in · ParkGuardian</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}" />
</head>
<body>
  <main class="kiosk">
    <header class="kiosk-head">
      <span class="brand" style="margin:0">PG</span>
      <div>
        <h1>Welcome</h1>
        <div class="muted" style="font-size:13px">Choose your bay and drive in</div>
      </div>
      <div class="spacer"></div>
      <span class="pill" id="kiosk-status">Connecting…</span>
    </header>

    <section class="field">
      <label for="k-gate">Your entrance</label>
      <select class="select" id="k-gate" style="height:44px">
        {% for g in gates %}<option value="{{ g }}" {% if g == selected_gate %}selected{% endif %}>{{ g }}</option>{% endfor %}
      </select>
    </section>

    <section>
      <div class="kiosk-step" style="margin-bottom:8px">1 · Vehicle type</div>
      <div class="type-switch" id="k-type" role="group" aria-label="Vehicle type">
        <button type="button" data-type="Normal" class="is-on" aria-pressed="true">Standard</button>
        <button type="button" data-type="Electric" aria-pressed="false">⚡ Electric</button>
        <button type="button" data-type="Accessible" aria-pressed="false">♿ Accessible</button>
      </div>
    </section>

    <section>
      <div class="kiosk-step">2 · Pick a bay</div>
      <div id="k-bays" aria-live="polite"></div>
    </section>

    <div id="k-result" role="status"></div>
  </main>

  <div class="kiosk-bar">
    <form class="inner" id="k-form">
      <label class="sr-only" for="k-plate">Number plate</label>
      <input class="input" id="k-plate" placeholder="Number plate, e.g. WCT 759" maxlength="16" autocomplete="off" style="height:46px;font-family:var(--mono);letter-spacing:0.06em;text-transform:uppercase" />
      <button class="btn primary" id="k-submit" type="submit" disabled>Select a bay</button>
    </form>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/static/js/pages/gate.js?v={{ asset_version }}"></script>
</body>
</html>
