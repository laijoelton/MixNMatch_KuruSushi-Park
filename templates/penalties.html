{% extends "base.html" %}
{% block title %}Penalties{% endblock %}
{% block heading %}Penalties{% endblock %}
{% block crumb %}Fines raised by the simulator, newest first{% endblock %}
{% block content %}
<section class="panel" aria-label="Penalties">
  <form class="filters" id="p-filters" role="search">
    <div class="field">
      <label for="p-code">Reason contains</label>
      <input class="input" id="p-code" name="code" placeholder="e.g. Penalty_CarEscaped" autocomplete="off" />
    </div>
    <div class="spacer" style="flex:1"></div>
    <button class="btn ghost" type="reset" id="p-reset">Reset</button>
  </form>
  <div class="table-wrap">
    <table class="table" aria-describedby="p-summary">
      <thead>
        <tr>
          <th>When</th><th>Reason</th><th>Type</th><th>Component</th><th class="num">Fine</th>
        </tr>
      </thead>
      <tbody id="p-rows"></tbody>
    </table>
  </div>
  <div class="pager">
    <span id="p-summary">—</span>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
(function () {
  const rowsEl = document.getElementById('p-rows');
  const summaryEl = document.getElementById('p-summary');
  const form = document.getElementById('p-filters');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  async function load() {
    const code = new FormData(form).get('code') || '';
    const qs = code ? `?code=${encodeURIComponent(code)}` : '';
    const res = await fetch(`/api/penalties${qs}`, { credentials: 'same-origin' });
    if (!res.ok) {
      summaryEl.textContent = 'Failed to load penalties';
      return;
    }
    const rows = await res.json();
    rowsEl.innerHTML = rows.map((r) => `
      <tr>
        <td>${esc(r.server_datetime || '')}</td>
        <td>${esc(r.reason || '')}</td>
        <td>${esc(r.type || '')}</td>
        <td>${esc(r.component_name || '')}</td>
        <td class="num">${Number(r.fine_amount || 0).toFixed(2)}</td>
      </tr>`).join('');
    const total = rows.reduce((sum, r) => sum + Number(r.fine_amount || 0), 0);
    summaryEl.textContent = `${rows.length} penalt${rows.length === 1 ? 'y' : 'ies'} · total fines ${total.toFixed(2)}`;
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); load(); });
  form.addEventListener('reset', () => setTimeout(load, 0));
  load();
})();
</script>
{% endblock %}
